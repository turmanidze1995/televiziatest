name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Unpack and fetch submodules
        run: |
          unzip -q src.zip
          cd M3UAndroid-master
          rm -rf parser native-load-gradle-plugin
          git clone --depth 1 https://github.com/oxyroid/parser.git parser
          git clone --depth 1 https://github.com/oxyroid/native-load-gradle-plugin.git native-load-gradle-plugin
          chmod +x gradlew
      - name: Build
        working-dir
