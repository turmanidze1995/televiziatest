name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Unpack
        run: unzip -q src.zip
      - name: Fetch parser
        run: git clone --depth 1 https://github.com/oxyroid/parser.git M3UAndroid-master/parser_new
      - name: Fetch plugin
        run: git clone --depth 1 https://github.com/oxyroid/native-load-gradle-plugin.git M3UAndroid-master/plugin_new
      - name: Replace submodules
        run: cd M3UAndroid-master && rm -rf parser native-load-gradle-plugin && mv parser_new parser && mv plugin_new native-load-gradle-plugin && chmod +x gradlew
      - name: Patch plugin
        run: sed -i 's/buildConfigFields\./buildConfigFields?./g' M3UAndroid-master/native-load-gradle-plugin/src/main/kotlin/dev/oxyroid/nativeload/NativeLoadPlugin.kt
      - name: Build
        run: cd M3UAndroid-master && ./gradlew :app:smartphone:assembleRelease --no-daemon
      - name: Collect APK
        run: mkdir -p out && cp $(find M3UAndroid-master -name "*.apk") out/ && ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Televizia-APK
          path: out
          if-no-files-found: error
