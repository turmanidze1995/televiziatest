ლname: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:smartphone:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Televizia-APK
          path: app/smartphone/build/outputs/**/*.apk
